[project]
name = "bizintel-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5.0",
    "lxml>=5.2.0",
    "pdfplumber>=0.11.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.36.0",
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
graphrag = [
    "graphrag>=3.0,<4.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent", "retrieval", "verification", "tools", "app", "eval"]
